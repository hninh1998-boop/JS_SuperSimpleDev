<!DOCTYPE html>
<html>

<head>
  <title>coin-flip game</title>
</head>

<body>
  <button onclick="
    playGame('heads')
  ">heads</button>
  
  <button onclick="
    playGame('heads')
  ">tails</button>
  
  <script>
    function playGame(guess) {
      const computerMove = getComputerMove();

      if (guess === computerMove) {
        console.log('You win!')
      } else {
        console.log('You lose!')
      }
    }

    function getComputerMove() {
      const randomNumber = Math.random();
      let computerMove = '';

      if (randomNumber < 0.5) {
        computerMove = 'heads'
      } else {
        computerMove = 'tails'
      }

      return computerMove;
    }
  </script>
</body>

</html>
