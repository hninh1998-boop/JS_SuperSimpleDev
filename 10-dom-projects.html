<!DOCTYPE html>
<html>

<head>
  <title>DOM Projects</title>
  <style>
    body {
      font-family: Arial;
      padding-bottom: 110px;
    }

    .subscribe-button {
      background-color: black;
      color: white;
      border: none;
      padding-top: 10px;
      padding-bottom: 10px;
      padding-left: 15px;
      padding-right: 15px;
      border-radius: 50px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 35px;
    }

    .is-subscribed {
      background-color: rgb(240, 240, 240);
      color: black;
    }

    .cost-input {
      padding-top: 10px;
      padding-bottom: 10px;
      padding-left: 10px;
      padding-right: 10px;
      font-size: 15px;
    }

    .calculate-button {
      background-color: green;
      color: white;
      border: none;
      padding-top: 12px;
      padding-bottom: 12px;
      padding-left: 15px;
      padding-right: 15px;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>

<body>  
  <p>YouTube Subscribe Button</p>
  <button class="subscribe-button js-subscribe-button" 
  onclick="
    subscribe();
  ">Subscribe</button>
  
  <p>Amazon Shipping Calculator</p>
  <p>Orders under $40 = +$10 shipping.</p>
  <p>Orders over $40 = FREE shipping.</p>
  <input placeholder="Cost of order" 
  class="cost-input js-cost-input" 
  onkeydown="
    handleCostKeydown(event);
  ">
  <button class="calculate-button" 
  onclick="
    calculateTotal();
  ">Calculate</button>
  <p class="js-total-cost"></p>

  <script>
    String(25);
    console.log('25' - 5);
    console.log('25' + 5);

    window.document
    window.console.log('window');
    window.alert

    function handleCostKeydown(event) {
      if (event.key === 'Enter') {
        calculateTotal(); 
      }
    }

    function calculateTotal() {
      const inputElement = document.querySelector('.js-cost-input');
      const totalCostElement = document.querySelector('.js-total-cost');
      const cost = Number(inputElement.value);
      let valueShipping = 0;

      if (cost < 40) {
        valueShipping = cost + 10;
      } else {
        valueShipping = cost;
      }
      totalCostElement.innerHTML = `$${valueShipping}`;
    }
    
    function subscribe() {
      const buttonElement = document.querySelector('.js-subscribe-button');

      if ( buttonElement.innerText === 'Subscribe') {
        buttonElement.innerHTML = 'Subscribed';
        buttonElement.classList.add('is-subscribed');
      } else if (buttonElement.innerText === 'Subscribed') {
        buttonElement.innerHTML = 'Subscribe';
        buttonElement.classList.remove('is-subscribed');
      }
      // buttonElement.classList.toggle('is-subscribed'); 
    }
  </script>
</body>

</html>
