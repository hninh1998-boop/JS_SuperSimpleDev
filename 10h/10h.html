<!DOCTYPE html>
<html>

<head>
  <title>DOM Projects</title>
  <link rel="stylesheet" href="10h.css">
</head>

<body>  
  <p>YouTube Subscribe Button</p>
  <button class="subscribe-button js-subscribe-button" 
  onclick="
    subscribe();
  ">Subscribe</button>
  
  <p>Amazon Shipping Calculator</p>
  <p>Orders under $40 = +$10 shipping.</p>
  <p>Orders over $40 = FREE shipping.</p>
  <input placeholder="Cost of order" 
  class="cost-input js-cost-input" 
  onkeydown="
    handleCostKeydown(event);
  ">
  <button class="calculate-button" 
  onclick="
    calculateTotal();
  ">Calculate</button>
  <p class="js-total-cost"></p>

  <script src="10h.js"></script>
</body>

</html>
