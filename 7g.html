<!DOCTYPE html>
<html>

<head>
  <title>7g</title>
</head>

<body>
  <script>
    function convertLength(length, from, to) {
      let lengthConvert = 0;
      let result = '';

      if (from === 'miles' && to === 'km') {
        lengthConvert = length * 1.6;
      } else if (from === 'km' && to === 'miles') {
        lengthConvert = length / 1.6;      
      } else if (from === to) {
        lengthConvert = length;      
      }

      result = `${lengthConvert} ${to}`;
    
      return result;
    }

    const length1 = convertLength(50, 'miles', 'km');
    const length2 = convertLength(32, 'km', 'miles');
    const length3 = convertLength(50, 'km', 'km');
    const length4 = convertLength(50, 'miles', 'miles');
  </script>
</body>

</html>
