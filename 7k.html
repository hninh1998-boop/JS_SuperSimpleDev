<!DOCTYPE html>
<html>

<head>
  <title>Cart Quantity</title>
</head>

<body>
  <p>Cart Quantity</p>

  <button onclick="
    console.log(`Cart Quantity: ${cartQuantity}`);
  ">Show Quantity</button>

  <button onclick="
    cartQuantity = updateCartQuantity(1);      
  ">Add to Cart</button>

  <button onclick="
    cartQuantity = updateCartQuantity(2); 
  ">+2</button>

  <button onclick="
    cartQuantity = updateCartQuantity(3); 
  ">+3</button>

  <button onclick="
    cartQuantity = updateCartQuantity(4); 
  ">+4</button>

  <button onclick="
    cartQuantity = updateCartQuantity(5); 
  ">+5</button>

  <button onclick="
    cartQuantity = updateCartQuantity(-1);    
  ">Remove from cart</button>

  <button onclick="
    cartQuantity = updateCartQuantity(-2);       
  ">-2</button>

  <button onclick="
    cartQuantity = updateCartQuantity(-3);       
  ">-3</button>

  <button onclick="
    cartQuantity = 0;
    console.log('Cart was reset.');  
    console.log(`Cart Quantity: ${cartQuantity}`);  
  ">Reset Cart</button>

  <script>
    let cartQuantity = 0;

    function updateCartQuantity(value) {
      if (value < 0 ) {
        if (cartQuantity + value < 0) {
          alert('Not enough items in the cart');
        } else {
          cartQuantity+=value;
          console.log(`Cart Quantity: ${cartQuantity}`);     
        }
      } else if (value >= 0 ) {
        if (cartQuantity + value > 10) {
          alert('The cart is full');
        } else {
          cartQuantity+=value;
          console.log(`Cart Quantity: ${cartQuantity}`);    
        }             
      }

      return cartQuantity;
    }
  </script>
</body>

</html>
