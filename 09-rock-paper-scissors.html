<!DOCTYPE html>
<html>

<head>
  <title>Rock Paper Scissors</title>
</head>

<body>
  <p>Rock Paper Scissors</p>

  <button onclick="
    playGame('rock');
  ">Rock</button>

  <button onclick="
    playGame('paper');
  ">Paper</button>

  <button onclick="
    playGame('scissors');
  ">Scissors</button>

  <P class="js-result"></P>
  <P class="js-moves"></P>
  <p class="js-score"></p>

  <button onclick="
    getScoreNull();
    score.wins = 0;
    score.losses = 0;
    score.ties = 0;
    localStorage.removeItem('score');
    updateScoreElement();    
  ">Reset Score</button>

  <script>
    let score = {
      wins: 0,
      losses: 0,
      ties: 0
    };

    const getScoreString = localStorage.getItem('score');
    score = JSON.parse(getScoreString);
    getScoreNull();

    const viewScore = document.querySelector('.js-score');
    updateScoreElement();

    // Main Processing
    function playGame(playerMove) {
      const computerMove = pickComputerMove();     
      const result = getResult(playerMove, computerMove);
      displayResult(result, playerMove, computerMove);
    }
    
    // Functions to follow processing
    function displayResult(result, playerMove, computerMove) {
      getScoreNull();

      if (result === 'You win.') {
        score.wins++;
      } else if (result === 'You lose.') {
        score.losses++;
      } else if (result === 'Tie.') {
        score.ties++;
      }
      
      document.querySelector('.js-result')
        .innerHTML = result;

      document.querySelector('.js-moves')
        .innerHTML = `You ${playerMove} - ${computerMove} Computer`;

      localStorage.setItem('score', JSON.stringify(score));
      
      updateScoreElement();
    }

    function updateScoreElement() {
      viewScore
        .innerHTML = `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`;
    }

    function getResult(playerMove, computerMove) {
      let result = '';
      
      if (playerMove === 'scissors') {
        if (computerMove === 'rock') {
          result = 'You lose.';
        } else if (computerMove === 'paper') {
          result = 'You win.';
        } else if (computerMove === 'scissors') {
          result = 'Tie.';
        }
        
      } else if (playerMove === 'rock') {
        if (computerMove === 'rock') {
          result = 'Tie.';
        } else if (computerMove === 'paper') {
          result = 'You lose.';
        } else if (computerMove === 'scissors') {
          result = 'You win.';
        }
        
      } else if (playerMove === 'paper') {
        if (computerMove === 'rock') {
          result = 'You win.';
        } else if (computerMove === 'paper') {
          result = 'Tie.';
        } else if (computerMove === 'scissors') {
          result = 'You lose.';
        }
      }

      return result;
    }

    function pickComputerMove() {
      const randomNumber = Math.random();
      let computerMove = '';

      if (randomNumber >= 0 && randomNumber < 1 / 3) {
        computerMove = 'rock';
      } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
        computerMove = 'paper';
      } else if (randomNumber >= 2 / 3 && randomNumber < 1) {
        computerMove = 'scissors';
      }

      return computerMove;
    }

    function getScoreNull() {
      if (!score) {
        score = {
          wins: 0,
          losses: 0,
          ties: 0
        };
      }
    }
  </script>
</body>

</html>
