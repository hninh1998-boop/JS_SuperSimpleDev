<!DOCTYPE html>
<html>

<head>
  <title>Cart Quantity</title>
</head>

<body>
  <p>Cart Quantity</p>

  <button onclick="
    cartPElement.innerHTML = `Cart quantity: ${cartQuantity}`
  ">Show Quantity</button>

  <button onclick="
    cartQuantity = updateCartQuantity(1);      
  ">Add to Cart</button>

  <button onclick="
    cartQuantity = updateCartQuantity(2); 
  ">+2</button>

  <button onclick="
    cartQuantity = updateCartQuantity(3); 
  ">+3</button>

  <button onclick="
    cartQuantity = updateCartQuantity(4); 
  ">+4</button>

  <button onclick="
    cartQuantity = updateCartQuantity(5); 
  ">+5</button>

  <button onclick="
    cartQuantity = updateCartQuantity(-1);    
  ">Remove from cart</button>

  <button onclick="
    cartQuantity = updateCartQuantity(-2);       
  ">-2</button>

  <button onclick="
    cartQuantity = updateCartQuantity(-3);       
  ">-3</button>

  <button onclick="
    cartQuantity = 0;
    
    cartPElement.innerHTML = `Cart quantity: ${cartQuantity}`;
    localStorage.setItem('cartQuantity',cartQuantity);
  ">Reset Cart</button>

  <p class="js-cart-quant"></p>

  <script>
    let cartQuantity = localStorage.getItem('cartQuantity') || 0;

    const cartPElement = document.querySelector('.js-cart-quant');
    cartPElement.innerHTML = `Cart quantity: ${cartQuantity}`;

    function updateCartQuantity(value) {
      if (value < 0 ) {
        if (cartQuantity + value < 0) {
          alert('The cart is full');
          return cartQuantity;
        }
      } else if (value >= 0 ) {
        if (cartQuantity + value > 10) {
          alert('Not enough items in the cart');
          return cartQuantity;
        }
      }
      
      cartQuantity+=value;
      cartPElement.innerHTML = `Cart quantity: ${cartQuantity}`
      localStorage.setItem('cartQuantity',cartQuantity);
      
      return cartQuantity;
    }
  </script>
</body>

</html>
