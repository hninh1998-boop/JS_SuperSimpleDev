<!DOCTYPE html>
<html>

<head>
  <title>Calculator</title>
</head>

<body>
  <p>
    <button onclick="
      calculation = updateCalculation('1');
    ">1</button>

    <button onclick="
      calculation = updateCalculation('2');
      ">2</button>

    <button onclick="
      calculation = updateCalculation('3');
    ">3</button>

    <button onclick="
      calculation = updateCalculation(' + ');
    ">+</button>
  </p>

  <p>
    <button onclick="
      calculation = updateCalculation('4');
    ">4</button>

    <button onclick="
      calculation = updateCalculation('5');
    ">5</button>

    <button onclick="
      calculation = updateCalculation('6');
    ">6</button>

    <button onclick="
      calculation = updateCalculation(' - ');
    ">-</button>
  </p>

  <p>
    <button onclick="
      calculation = updateCalculation('7');
    ">7</button>

    <button onclick="
      calculation = updateCalculation('8');
    ">8</button>

    <button onclick="
      calculation = updateCalculation('9');
    ">9</button>

    <button onclick="
      calculation = updateCalculation(' * ');
    ">*</button>
  </p>  

  <p>
    <button onclick="
      calculation = updateCalculation('0');
    ">0</button>

    <button onclick="
      eval(calculation)
    ">.</button>

    <button onclick="
      calculation = eval(calculation);
      console.log(calculation);
    ">=</button>
    
    <button onclick="
      calculation = updateCalculation(' / ');
    ">/</button>
  </p>
  
  <p>
    <button onclick="
      getCalculationNull()    
      calculation = '';
      console.log('Cleared.');
      localStorage.removeItem('calculation');
    ">Clear</button>    
  </p>

  <script>
    let calculation = '';
    calculation = localStorage.getItem('calculation');
    
    function updateCalculation(value) {  
      getCalculationNull();      
      calculation += value;
      console.log(calculation);

      localStorage.setItem('calculation',calculation)

      return calculation;
    }

    function getCalculationNull() {
      if (calculation === null) {
        calculation = '';
      }
    }
  </script>
</body>

</html>
