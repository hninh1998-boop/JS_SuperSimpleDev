<!DOCTYPE html>
<html>

<head>
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="12w.css">
</head>

<body>
  <p class="title">Rock Paper Scissors</p>

  <button class="move-button js-rock-button">
    <img class="move-icon" id="img-rock">
  </button>

  <button class="move-button js-paper-button">
    <img class="move-icon" id="img-paper">
  </button>

  <button class="move-button js-scissors-button">
    <img class="move-icon" id="img-scissors">
  </button>

  <P class="js-result result"></P>
  <P class="js-moves"></P>
  <p class="js-score score"></p>

  <button class="js-reset-score-button reset-score-button">Reset Score</button>
  <button class="js-auto-play-button auto-play-button">Auto Play</button>
  
  <div class="confirm-msg js-confirm-msg"></div>

  <script src="12w.js"></script>
</body>

</html>
