<!DOCTYPE html>
<html>

<head>
  <title>9e</title>
</head>

<body>
  <input class="js-name-input" 
  placeholder="Name" 
  onkeydown="
    getNameEvent(event);
  ">

  <button class="js-submit-btn" 
  onclick="
    getName();
  ">Submit</button>
  
  <p class="js-name"></p>

  <script>
    function getNameEvent(event) {
      if (event.key === 'Enter') {
        getName();
      }
    }

    function getName() {
      const nameInputElement = document.querySelector('.js-name-input');
      const nameElement = document.querySelector('.js-name');

      nameElement.innerHTML = `Your name is: ${nameInputElement.value}`; 
    }
  </script>
</body>

</html>
